/* =========================================================
   SNELWEGEN STATISTIEK
========================================================= */

function toonSnelwegStatistiek(
    ritten
) {

    const totaal =
        {};


    ritten.forEach(
        rit => {

            if (
                !rit.segmenten
            ) {
                return;
            }


            rit.segmenten
                .forEach(
                    segment => {

                        const label =
                            segment.snelweg;


                        const afstand =
                            Number(
                                segment.afstandKm
                            ) || 0;


                        /*
                            A1/A35 wordt bij beide
                            snelwegen meegerekend.
                        */

                        label.split("/")
                            .forEach(
                                snelweg => {

                                    if (
                                        !/^A\d+$/.test(
                                            snelweg
                                        )
                                    ) {
                                        return;
                                    }


                                    if (
                                        !totaal[
                                            snelweg
                                        ]
                                    ) {

                                        totaal[
                                            snelweg
                                        ] = 0;

                                    }


                                    totaal[
                                        snelweg
                                    ] +=
                                        afstand;

                                }
                            );

                    }
                );

        }
    );


    const lijst =
        Object.entries(
            totaal
        )
        .sort(
            (a,b) =>
                b[1] -
                a[1]
        );


    renderStatLijst(
        "statSnelwegenTop",
        lijst.slice(
            0,
            10
        ),
        item =>
            item[0],
        item =>
            `${item[1].toFixed(0)} km`
    );


    renderStatLijst(
        "statSnelwegenVolledig",
        lijst,
        item =>
            item[0],
        item =>
            `${item[1].toFixed(0)} km`
    );

}

   DAGEN STATISTIEK

function toonDagStatistiek(
    ritten
) {

    const totaal =

    ritten.forEach(

            }


            const afstand =

                ) || 0;


            totaal[
                rit.datum
            ] =
                (
                    totaal[
                        rit.datum
                    ] || 0
                ) +

        }
    );


    const lijst =
        Object.entries(

        )

        );

            10
        ),
        item =>
            formatteerDatum(

            ),

            `${item[1].toFixed(0)} km`
    );


    renderStatLijst(

            ),

            `${item[1].toFixed(0)} km`
    );

}


/* =========================================================
   ROUTES STATISTIEK
========================================================= */

function toonRouteStatistiek(
    ritten
) {

    const routes =
        {};


    ritten.forEach(
        rit => {

            const naam =
                String(
                    rit.naam ||
                    "Onbekende route"
                )
                .trim();


            if (
                !routes[naam]
            ) {

                routes[naam] = {

                    aantal: 0,

                    km: 0

                };

            }


            routes[naam].aantal++;

            routes[naam].km +=
                Number(
                    rit.afstandKm
                ) || 0;

        }
    );


    const lijst =
        Object.entries(
            routes
        )
        .sort(
            (a,b) => {

                if (
                    b[1].aantal !==
                    a[1].aantal
                ) {

                    return (
                        b[1].aantal -
                        a[1].aantal
                    );

                }


                return (
                    b[1].km -
                    a[1].km
                );

            }
        );


    renderStatLijst(
        "statRoutesTop",
        lijst.slice(
            0,
            10
        ),
        item =>
            item[0],
        item =>
            `${item[1].aantal}x`
    );


    renderStatLijst(
        "statRoutesVolledig",
        lijst.slice(
            0,
            30
        ),
        item =>
            item[0],
        item =>
            `${item[1].aantal}x`
    );

}

/* =========================================================
   STATISTIEKEN KAART
========================================================= */

function tekenStatistiekenKaart(
    ritten
) {

    const element =
        document.getElementById(
            "statKaart"
        );


    if (statMap) {
        statMap.remove();
        statMap = null;
    }


    element.innerHTML = "";


    if (!ritten.length) {
        element.innerHTML =
            `<div class="status-message">
                Voeg eerst ritten toe om de kaart te bekijken.
            </div>`;
        return;
    }


    const rittenMetRoute =
        ritten.filter(
            rit =>
                rit.routeCoordinates &&
                rit.routeCoordinates.length >= 2
        );


    if (!rittenMetRoute.length) {
        element.innerHTML =
            `<div class="status-message">
                Voor de opgeslagen ritten is geen routegeometrie beschikbaar.
            </div>`;
        return;
    }


    statMap =
        L.map("statKaart");


    L.tileLayer(
        "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_3uab_1_ab1fc2b9ab1730e2f89ce341",
        {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            maxZoom: 20
        }
    ).addTo(statMap);


    /*
        Elke gereden route bestaat uit lijnsegmenten.

        We tellen nu dezelfde segmenten op in plaats van met een
        raster/heatmap te werken. Daardoor wordt een weg niet meer
        als losse bolletjes of vage vlakken getekend.

        1x gereden = 5 px
        2x gereden = 7 px
        3x gereden = 9 px
        enzovoort.

        De richting maakt niet uit: A -> B en B -> A tellen als
        hetzelfde segment.
    */

    const segmenten = new Map();


    function rondCoordinaat(value) {
        /* ongeveer 1 meter nauwkeurigheid */
        return Number(value).toFixed(5);
    }


    function puntSleutel(coord) {
        return (
            rondCoordinaat(coord[0]) +
            "," +
            rondCoordinaat(coord[1])
        );
    }


    function segmentSleutel(a, b) {
        const sleutelA = puntSleutel(a);
        const sleutelB = puntSleutel(b);

        return sleutelA < sleutelB
            ? sleutelA + "|" + sleutelB
            : sleutelB + "|" + sleutelA;
    }


    rittenMetRoute.forEach(
        rit => {

            const coords =
                rit.routeCoordinates;


            for (
                let i = 0;
                i < coords.length - 1;
                i++
            ) {

                const a = coords[i];
                const b = coords[i + 1];

                if (
                    !Array.isArray(a) ||
                    !Array.isArray(b) ||
                    a.length < 2 ||
                    b.length < 2
                ) {
                    continue;
                }


                const sleutel =
                    segmentSleutel(a, b);


                const bestaand =
                    segmenten.get(sleutel);


                if (bestaand) {
                    bestaand.aantal++;
                } else {
                    segmenten.set(
                        sleutel,
                        {
                            a: [a[1], a[0]],
                            b: [b[1], b[0]],
                            aantal: 1
                        }
                    );
                }

            }

        }
    );


    /*
        Elk uniek segment wordt exact één keer getekend.
        Alleen het aantal keer dat dat segment voorkomt bepaalt
        de lijndikte.
    */
    segmenten.forEach(
        segment => {

            const gewicht =
                5 +
                (2 * (segment.aantal - 1));


            L.polyline(
                [
                    segment.a,
                    segment.b
                ],
                {
                    weight: gewicht,
                    opacity: 0.85,
                    lineCap: "round",
                    lineJoin: "round"
                }
            ).addTo(statMap);

        }
    );


    const eerste =
        rittenMetRoute[0]
            .routeCoordinates;


    const eersteCoords =
        eerste.map(
            c =>
                [
                    c[1],
                    c[0]
                ]
        );


    const bounds =
        L.latLngBounds(
            eersteCoords
        );


    rittenMetRoute
        .slice(1)
        .forEach(
            rit => {

                rit.routeCoordinates
                    .forEach(
                        coord => {
                            bounds.extend([
                                coord[1],
                                coord[0]
                            ]);
                        }
                    );

            }
        );


    statMap.fitBounds(
        bounds,
        {
            padding: [
                20,
                20
            ]
        }
    );

}


/* =========================================================
   DATA LADEN
========================================================= */

async function laadOSMData() {

    const resultaat =
        document.getElementById(
            "resultaat"
        );


    resultaat.innerHTML =
        `<span class="loading">
            OSM-data wordt geladen...
        </span>`;


    try {

        /*
            De twee bestanden worden parallel
            opgehaald. Ze worden slechts één keer
            geladen.
        */

        const [
            snelwegenResponse,
            junctionsResponse
        ] =
            await Promise.all([

                fetch(
                    "nederlandse_snelwegen.geojson",
                    {
                        cache: "default"
                    }
                ),

                fetch(
                    "nederlandse_snelwegen_junction.geojson",
                    {
                        cache: "default"
                    }
                )

            ]);


        if (
            !snelwegenResponse.ok
        ) {

            throw new Error(
                "nederlandse_snelwegen.geojson kon niet worden geladen."
            );

        }


        if (
            !junctionsResponse.ok
        ) {

            throw new Error(
                "nederlandse_snelwegen_junction.geojson kon niet worden geladen."
            );

        }


        /*
            JSON parsen kan bij een groot bestand
            even duren. Dit gebeurt maar één keer.
        */

        osmSnelwegen =
            await snelwegenResponse.json();


        osmJunctions =
            await junctionsResponse.json();


        if (
            !osmSnelwegen.features ||
            !Array.isArray(
                osmSnelwegen.features
            )
        ) {

            throw new Error(
                "Het snelwegenbestand bevat geen geldige GeoJSON-features."
            );

        }


        if (
            !osmJunctions.features ||
            !Array.isArray(
                osmJunctions.features
            )
        ) {

            throw new Error(
                "Het aansluitingenbestand bevat geen geldige GeoJSON-features."
            );

        }


        /*
            Belangrijk:
            alle dure voorbereidingen gebeuren één keer.
        */

        bouwSnelwegIndex();

        koppelAansluitingenAanSnelwegen();

        vulSnelwegen();

        vulViaDropdown();


        dataGeladen =
            true;


        resultaat.innerHTML =
            `<span class="loading">
                OSM-data geladen. Kies een oprit en afrit.
            </span>`;


    } catch (error) {

        console.error(
            "OSM laden mislukt:",
            error
        );


        resultaat.innerHTML =
            `
            <strong>OSM-data kon niet worden geladen.</strong>
            <br><br>
            Controleer of deze twee bestanden naast index.html staan:
            <br>
            nederlandse_snelwegen.geojson
            <br>
            nederlandse_snelwegen_junction.geojson
            `;
