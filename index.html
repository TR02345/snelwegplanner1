<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snelwegplanner</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f5f7;
    font-family: Arial, sans-serif;
    color: #222;
}

/* =========================
   NAVIGATIE
========================= */

.topbar {
    width: 100%;
    background: #111;
}

.nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
}

.nav-tab {
    width: auto;
    min-width: 150px;
    padding: 17px 22px;
    border: none;
    border-radius: 0;
    background: #111;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.nav-tab:hover {
    background: #222;
}

.nav-tab.active {
    background: white;
    color: #111;
}

/* =========================
   ALGEMEEN
========================= */

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.page {
    width: 100%;
}

.hidden {
    display: none !important;
}

h1 {
    font-size: 32px;
    margin: 0 0 25px 0;
}

h2 {
    font-size: 20px;
    margin: 0 0 15px 0;
}

.planner {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

/* =========================
   PLANNER
========================= */

.section {
    margin-bottom: 25px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

select,
input[type="date"] {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
    background: white;
}

.via {
    background: #f1f3f5;
    padding: 18px;
    border-radius: 10px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #333;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.secondary-button {
    background: #e9ecef;
    color: #111;
}

.secondary-button:hover {
    background: #dfe3e6;
}

.danger-button {
    background: #b42318;
}

.danger-button:hover {
    background: #8f1c13;
}

#resultaat {
    margin-top: 25px;
    padding: 18px;
    background: #f1f3f5;
    border-radius: 10px;
    font-size: 16px;
}

#map {
    height: 500px;
    margin-top: 25px;
    border-radius: 10px;
}

/* =========================
   RITTEN
========================= */

.ritten-lijst {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.rit-item {
    background: #f1f3f5;
    border-radius: 10px;
    padding: 15px 18px;
}

.rit-naam {
    background: none;
    color: #111;
    width: auto;
    padding: 0;
    text-align: left;
    font-size: 17px;
    font-weight: bold;
}

.rit-naam:hover {
    background: none;
    text-decoration: underline;
}

.rit-info {
    margin-top: 7px;
    color: #555;
    font-size: 14px;
}

.geen-ritten {
    background: #f1f3f5;
    padding: 18px;
    border-radius: 10px;
    color: #555;
}

/* =========================
   DETAIL
========================= */

.back-button {
    width: auto;
    padding: 9px 14px;
    margin-bottom: 20px;
    background: #e9ecef;
    color: #111;
    font-size: 14px;
}

.detail-datum {
    color: #666;
    margin-top: -15px;
    margin-bottom: 20px;
}

.detail-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.detail-actions button {
    font-size: 14px;
    padding: 11px;
}

.editor {
    background: #f1f3f5;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.editor .row {
    margin-bottom: 15px;
}

.detail-sectie {
    margin-top: 25px;
}

.detail-segment {
    display: grid;
    grid-template-columns: 1fr 130px;
    gap: 15px;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
}

.detail-segment:last-child {
    border-bottom: none;
}

.detail-totaal {
    font-weight: bold;
    font-size: 17px;
    padding-top: 15px;
}

#detailMap {
    height: 450px;
    margin-top: 20px;
    border-radius: 10px;
}

.status-message {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: #fff;
    color: #555;
    font-size: 14px;
}

/* =========================
   STATISTIEKEN
========================= */

.stat-sectie {
    margin-bottom: 35px;
}

.stat-lijst {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.stat-rij {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    padding: 10px 12px;
    background: #f1f3f5;
    border-radius: 7px;
}

.stat-waarde {
    font-weight: bold;
}

.stat-link {
    width: auto;
    padding: 7px 0;
    margin-top: 8px;
    background: none;
    color: #111;
    text-align: left;
    font-size: 14px;
}

.stat-link:hover {
    background: none;
    text-decoration: underline;
}

.junction-rij {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr 80px;
    gap: 10px;
    padding: 10px 12px;
    background: #f1f3f5;
    border-radius: 7px;
}

#statKaart {
    height: 600px;
    border-radius: 10px;
    margin-top: 15px;
}

/* =========================
   LAADSTATUS
========================= */

.loading {
    color: #555;
}

/* =========================
   MOBIEL
========================= */

@media (max-width: 700px) {

    .nav-inner {
        padding: 0 10px;
    }

    .nav-tab {
        min-width: 0;
        flex: 1;
        padding: 14px 8px;
        font-size: 13px;
    }

    .container {
        margin: 20px auto;
        padding: 0 12px;
    }

    .planner {
        padding: 18px;
    }

    .row {
        grid-template-columns: 1fr;
    }

    .detail-actions {
        grid-template-columns: 1fr 1fr;
    }

    .detail-segment {
        grid-template-columns: 1fr 90px;
    }

    .junction-rij {
        grid-template-columns: 1fr;
        gap: 4px;
    }

    #map {
        height: 400px;
    }

    #detailMap {
        height: 400px;
    }

    #statKaart {
        height: 450px;
    }
}

</style>
</head>

<body>

<!-- =========================
     NAVIGATIE
========================= -->

<div class="topbar">
    <div class="nav-inner">

        <button
            class="nav-tab active"
            onclick="toonPagina('plannerPagina', this)"
        >
            Routeplanner
        </button>

        <button
            class="nav-tab"
            onclick="toonPagina('rittenPagina', this)"
        >
            Toegevoegde ritten
        </button>

        <button
            class="nav-tab"
            onclick="toonPagina('statistiekenPagina', this)"
        >
            Statistieken
        </button>

    </div>
</div>


<div class="container">

<!-- =========================================================
     ROUTEPLANNER
========================================================= -->

<section id="plannerPagina" class="page">

    <div class="planner">

        <h1>Snelwegplanner</h1>

        <!-- OPRIT -->

        <div class="section">

            <h2>OPRIT</h2>

            <div class="row">

                <div>

                    <label for="opritSnelweg">
                        Snelweg
                    </label>

                    <select id="opritSnelweg">
                        <option value="">
                            Kies een snelweg
                        </option>
                    </select>

                </div>

                <div>

                    <label for="oprit">
                        Oprit
                    </label>

                    <select id="oprit">
                        <option value="">
                            Kies een aansluiting
                        </option>
                    </select>

                </div>

            </div>

        </div>


        <!-- VIA -->

        <div class="section via">

            <h2>VIA</h2>

            <label for="viaSnelweg">
                Knooppunt / snelweg
            </label>

            <select id="viaSnelweg">

                <option value="">
                    Geen VIA
                </option>

            </select>

        </div>


        <!-- AFRIT -->

        <div class="section">

            <h2>AFRIT</h2>

            <div class="row">

                <div>

                    <label for="afritSnelweg">
                        Snelweg
                    </label>

                    <select id="afritSnelweg">
                        <option value="">
                            Kies een snelweg
                        </option>
                    </select>

                </div>

                <div>

                    <label for="afrit">
                        Afrit
                    </label>

                    <select id="afrit">
                        <option value="">
                            Kies een aansluiting
                        </option>
                    </select>

                </div>

            </div>

        </div>


        <button onclick="berekenRoute()">
            Bereken route
        </button>

        <button
            id="routeToevoegenKnop"
            class="secondary-button"
            onclick="voegHuidigeRouteToe()"
            disabled
            style="margin-top:10px;"
        >
            Route toevoegen
        </button>


        <div id="resultaat">
            <span class="loading">
                OSM-data wordt geladen...
            </span>
        </div>

        <div id="map"></div>

    </div>

</section>


<!-- =========================================================
     TOEGEVOEGDE RITTEN
========================================================= -->

<section
    id="rittenPagina"
    class="page hidden"
>

    <div class="planner">

        <h1>Toegevoegde ritten</h1>

        <div
            id="rittenLijst"
            class="ritten-lijst"
        ></div>

    </div>

</section>


<!-- =========================================================
     RIT DETAIL
========================================================= -->

<section
    id="detailPagina"
    class="page hidden"
>

    <div class="planner">

        <button
            class="back-button"
            onclick="toonRittenPagina()"
        >
            ← Terug naar ritten
        </button>

        <h1 id="detailTitel"></h1>

        <div
            id="detailDatum"
            class="detail-datum"
        ></div>


        <div class="detail-actions">

            <button
                class="secondary-button"
                onclick="toonDatumEditor()"
            >
                Datum aanpassen
            </button>

            <button
                class="secondary-button"
                onclick="toonRouteEditor()"
            >
                Route aanpassen
            </button>

            <button
                class="danger-button"
                onclick="verwijderHuidigeRit()"
            >
                Rit verwijderen
            </button>

            <button
                class="secondary-button"
                onclick="toonRittenPagina()"
            >
                Terug naar ritten
            </button>

        </div>


        <div id="datumEditor"></div>

        <div id="routeEditor"></div>

        <div id="ritDetails"></div>

        <div id="detailMap"></div>

    </div>

</section>


<!-- =========================================================
     STATISTIEKEN
========================================================= -->

<section
    id="statistiekenPagina"
    class="page hidden"
>

    <div class="planner">

        <h1>Statistieken</h1>


        <!-- SNELWEGEN -->

        <div class="stat-sectie">

            <h2>Meest bereden snelwegen</h2>

            <div
                id="statSnelwegenTop"
                class="stat-lijst"
            ></div>

            <button
                class="stat-link"
                onclick="toggleStatistiek('statSnelwegenVolledig')"
            >
                Volledige lijst
            </button>

            <div
                id="statSnelwegenVolledig"
                class="stat-lijst hidden"
            ></div>

        </div>


        <!-- DAGEN -->

        <div class="stat-sectie">

            <h2>Dagen met meeste kilometers</h2>

            <div
                id="statDagenTop"
                class="stat-lijst"
            ></div>

            <button
                class="stat-link"
                onclick="toggleStatistiek('statDagenVolledig')"
            >
                Volledige lijst
            </button>

            <div
                id="statDagenVolledig"
                class="stat-lijst hidden"
            ></div>

        </div>


        <!-- ROUTES -->

        <div class="stat-sectie">

            <h2>Meest voorkomende routes</h2>

            <div
                id="statRoutesTop"
                class="stat-lijst"
            ></div>

            <button
                class="stat-link"
                onclick="toggleStatistiek('statRoutesVolledig')"
            >
                Top 30
            </button>

            <div
                id="statRoutesVolledig"
                class="stat-lijst hidden"
            ></div>

        </div>


        <!-- KAART -->

        <div class="stat-sectie">

            <h2>Alle gereden routes</h2>

            <div id="statKaart"></div>

        </div>

    </div>

</section>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   GLOBALE VARIABELEN
========================================================= */

let osmSnelwegen = null;
let osmJunctions = null;

let aansluitingenPerSnelweg = {};

let exacteSnelwegen = {};

let routeLayer = null;
let startMarker = null;
let endMarker = null;

let laatsteBerekendeRoute = null;

let huidigeRitId = null;

let detailMap = null;
let statMap = null;

let dataGeladen = false;


/* =========================================================
   LOCAL STORAGE
========================================================= */

const RITTEN_STORAGE_KEY =
    "snelwegplanner_ritten";


function haalRitten() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    RITTEN_STORAGE_KEY
                ) || "[]"
            );

        return Array.isArray(data)
            ? data
            : [];

    } catch (error) {

        console.error(
            "Fout bij lezen ritten:",
            error
        );

        return [];

    }

}


function slaRittenOp(ritten) {

    localStorage.setItem(
        RITTEN_STORAGE_KEY,
        JSON.stringify(ritten)
    );

}


/* =========================================================
   DATUM
========================================================= */

function vandaagISO() {

    const d = new Date();

    const jaar =
        d.getFullYear();

    const maand =
        String(
            d.getMonth() + 1
        ).padStart(2, "0");

    const dag =
        String(
            d.getDate()
        ).padStart(2, "0");

    return `${jaar}-${maand}-${dag}`;

}


function formatteerDatum(datum) {

    if (!datum) {
        return "";
    }

    const delen =
        datum.split("-");

    if (delen.length !== 3) {
        return datum;
    }

    return `${delen[2]}-${delen[1]}-${delen[0]}`;

}


/* =========================================================
   KAART
========================================================= */

const map =
    L.map("map")
        .setView(
            [52.2, 6.9],
            8
        );


L.tileLayer(
    "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_3uab_1_ab1fc2b9ab1730e2f89ce341",
    {
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',

        subdomains: "abcd",

        maxZoom: 20,

        tileSize: 256,

        detectRetina: false
    }
).addTo(map);


/* =========================================================
   NAVIGATIE
========================================================= */

function toonPagina(
    paginaId,
    knop
) {

    document
        .querySelectorAll(".page")
        .forEach(
            pagina => {
                pagina.classList.add(
                    "hidden"
                );
            }
        );


    const pagina =
        document.getElementById(
            paginaId
        );

    if (pagina) {
        pagina.classList.remove(
            "hidden"
        );
    }


    document
        .querySelectorAll(".nav-tab")
        .forEach(
            tab => {
                tab.classList.remove(
                    "active"
                );
            }
        );


    if (knop) {
        knop.classList.add(
            "active"
        );
    }


    if (paginaId === "plannerPagina") {

        setTimeout(
            () => map.invalidateSize(),
            50
        );

    }


    if (paginaId === "rittenPagina") {

        toonRitten();

    }


    if (paginaId === "statistiekenPagina") {

        toonStatistieken();

    }

}


function toonRittenPagina() {

    document
        .querySelectorAll(".page")
        .forEach(
            pagina => {
                pagina.classList.add(
                    "hidden"
                );
            }
        );

    document
        .getElementById(
            "rittenPagina"
        )
        .classList.remove(
            "hidden"
        );


    document
        .querySelectorAll(".nav-tab")
        .forEach(
            tab => {
                tab.classList.remove(
                    "active"
                );
            }
        );


    document
        .querySelectorAll(".nav-tab")[1]
        .classList.add(
            "active"
        );


    toonRitten();

}


/* =========================================================
   GEOJSON HELPERS
========================================================= */

function krijgProperties(feature) {

    if (
        !feature ||
        !feature.properties
    ) {
        return {};
    }

    return feature.properties;

}


function krijgRef(feature) {

    const p =
        krijgProperties(feature);

    return String(
        p.ref ||
        p["motorway:ref"] ||
        p.motorway_ref ||
        p.road_ref ||
        ""
    ).trim();

}


function krijgNaam(feature) {

    const p =
        krijgProperties(feature);

    return String(
        p.name ||
        p["name:nl"] ||
        p.destination ||
        p.description ||
        ""
    ).trim();

}


function krijgARefsUitRef(ref) {

    if (!ref) {
        return [];
    }

    return String(ref)
        .split(";")
        .map(
            x =>
                x.trim()
                .toUpperCase()
        )
        .filter(
            x =>
                /^A\d+$/.test(x)
        );

}


function isExacteSnelweg(
    feature,
    snelweg
) {

    const ref =
        krijgRef(feature);

    return ref.toUpperCase() ===
        snelweg.toUpperCase();

}


/* =========================================================
   AFSTANDEN
========================================================= */

function afstandTussenPunten(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

    return (
        2 *
        R *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        )
    );

}


function afstandRouteSegment(
    a,
    b
) {

    return afstandTussenPunten(
        a[1],
        a[0],
        b[1],
        b[0]
    );

}


/* =========================================================
   PUNT NAAR LIJN
========================================================= */

function afstandPuntNaarLijn(
    lat,
    lon,
    coordinates
) {

    let beste =
        Infinity;

    for (
        let i = 0;
        i < coordinates.length - 1;
        i++
    ) {

        const a =
            coordinates[i];

        const b =
            coordinates[i + 1];

        const latGem =
            (
                lat +
                a[1] +
                b[1]
            ) / 3;

        const xFactor =
            111320 *
            Math.cos(
                latGem *
                Math.PI /
                180
            );

        const yFactor =
            110540;

        const px =
            lon *
            xFactor;

        const py =
            lat *
            yFactor;

        const ax =
            a[0] *
            xFactor;

        const ay =
            a[1] *
            yFactor;

        const bx =
            b[0] *
            xFactor;

        const by =
            b[1] *
            yFactor;

        const dx =
            bx - ax;

        const dy =
            by - ay;

        let t = 0;

        if (
            dx !== 0 ||
            dy !== 0
        ) {

            t =
                (
                    (px - ax) * dx +
                    (py - ay) * dy
                ) /
                (
                    dx * dx +
                    dy * dy
                );

            t =
                Math.max(
                    0,
                    Math.min(1, t)
                );

        }

        const cx =
            ax + t * dx;

        const cy =
            ay + t * dy;

        const afstand =
            Math.sqrt(
                (px - cx) ** 2 +
                (py - cy) ** 2
            );

        if (
            afstand <
            beste
        ) {

            beste =
                afstand;

        }

    }

    return beste;

}


function afstandPuntNaarFeature(
    lat,
    lon,
    feature
) {

    if (
        !feature ||
        !feature.geometry
    ) {
        return Infinity;
    }

    const geometry =
        feature.geometry;


    if (
        geometry.type ===
        "LineString"
    ) {

        return afstandPuntNaarLijn(
            lat,
            lon,
            geometry.coordinates
        );

    }


    if (
        geometry.type ===
        "MultiLineString"
    ) {

        let beste =
            Infinity;

        geometry.coordinates
            .forEach(
                lijn => {

                    const d =
                        afstandPuntNaarLijn(
                            lat,
                            lon,
                            lijn
                        );

                    if (d < beste) {
                        beste = d;
                    }

                }
            );

        return beste;

    }

    return Infinity;

}


/* =========================================================
   DICHTSTBIJZIJNDE PUNT OP LIJN
========================================================= */

function dichtstbijzijndePuntOpLijn(
    lat,
    lon,
    coordinates
) {

    let beste = null;

    for (
        let i = 0;
        i < coordinates.length - 1;
        i++
    ) {

        const a =
            coordinates[i];

        const b =
            coordinates[i + 1];

        const latGem =
            (
                lat +
                a[1] +
                b[1]
            ) / 3;

        const xFactor =
            111320 *
            Math.cos(
                latGem *
                Math.PI /
                180
            );

        const yFactor =
            110540;

        const px =
            lon *
            xFactor;

        const py =
            lat *
            yFactor;

        const ax =
            a[0] *
            xFactor;

        const ay =
            a[1] *
            yFactor;

        const bx =
            b[0] *
            xFactor;

        const by =
            b[1] *
            yFactor;

        const dx =
            bx - ax;

        const dy =
            by - ay;

        let t = 0;

        if (
            dx !== 0 ||
            dy !== 0
        ) {

            t =
                (
                    (px - ax) * dx +
                    (py - ay) * dy
                ) /
                (
                    dx * dx +
                    dy * dy
                );

            t =
                Math.max(
                    0,
                    Math.min(1, t)
                );

        }

        const cx =
            ax + t * dx;

        const cy =
            ay + t * dy;

        const lonP =
            cx / xFactor;

        const latP =
            cy / yFactor;

        const afstand =
            afstandTussenPunten(
                lat,
                lon,
                latP,
                lonP
            );

        if (
            !beste ||
            afstand <
            beste.afstand
        ) {

            beste = {
                lat: latP,
                lon: lonP,
                afstand
            };

        }

    }

    return beste;

}


function dichtstbijzijndePuntOpFeature(
    lat,
    lon,
    feature
) {

    if (
        !feature ||
        !feature.geometry
    ) {
        return null;
    }

    const geometry =
        feature.geometry;


    let beste = null;


    function controleerLijn(
        coords
    ) {

        const kandidaat =
            dichtstbijzijndePuntOpLijn(
                lat,
                lon,
                coords
            );

        if (
            kandidaat &&
            (
                !beste ||
                kandidaat.afstand <
                beste.afstand
            )
        ) {

            beste =
                kandidaat;

        }

    }


    if (
        geometry.type ===
        "LineString"
    ) {

        controleerLijn(
            geometry.coordinates
        );

    }


    if (
        geometry.type ===
        "MultiLineString"
    ) {

        geometry.coordinates
            .forEach(
                controleerLijn
            );

    }


    return beste;

}


/* =========================================================
   OSM INDEX
========================================================= */

function bouwSnelwegIndex() {

    exacteSnelwegen = {};


    if (
        !osmSnelwegen ||
        !Array.isArray(
            osmSnelwegen.features
        )
    ) {
        return;
    }


    osmSnelwegen.features
        .forEach(
            feature => {

                const ref =
                    krijgRef(
                        feature
                    ).toUpperCase();


                if (
                    /^A\d+$/.test(ref)
                ) {

                    if (
                        !exacteSnelwegen[ref]
                    ) {

                        exacteSnelwegen[ref] =
                            [];

                    }

                    exacteSnelwegen[ref]
                        .push(feature);

                }

            }
        );

}


/* =========================================================
   AANSLUITINGEN
========================================================= */

function normaliseerAansluitingNaam(naam) {

    return String(naam || "")
        .replace(/^\s*\d+\s*:\s*/, "")
        .replace(/[(),]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();

}


function isDubbeleAansluiting(bestaande, lat, lon, naam) {

    const nieuweNaam =
        normaliseerAansluitingNaam(naam);

    return bestaande.some(
        punt => {

            if (
                normaliseerAansluitingNaam(punt.naam) !==
                nieuweNaam
            ) {
                return false;
            }

            return (
                afstandTussenPunten(
                    punt.lat,
                    punt.lon,
                    lat,
                    lon
                ) <= 75
            );

        }
    );

}


function koppelAansluitingenAanSnelwegen() {

    aansluitingenPerSnelweg = {};


    if (
        !osmJunctions ||
        !Array.isArray(
            osmJunctions.features
        )
    ) {
        return;
    }


    osmJunctions.features
        .forEach(
            feature => {

                if (
                    !feature.geometry ||
                    feature.geometry.type !==
                    "Point"
                ) {
                    return;
                }


                const naam =
                    krijgNaam(feature);


                if (!naam) {
                    return;
                }


                if (
                    naam
                        .toLowerCase()
                        .startsWith(
                            "knooppunt "
                        )
                ) {
                    return;
                }


                const coords =
                    feature.geometry.coordinates;

                const lon =
                    Number(coords[0]);

                const lat =
                    Number(coords[1]);


                let snelweg = "";

                const directeRef =
                    krijgRef(feature)
                        .toUpperCase();


                if (
                    /^A\d+$/.test(
                        directeRef
                    )
                ) {
                    snelweg = directeRef;
                }


                if (!snelweg) {

                    let beste = null;

                    Object.keys(
                        exacteSnelwegen
                    )
                    .forEach(
                        ref => {

                            exacteSnelwegen[ref]
                                .forEach(
                                    road => {

                                        const d =
                                            afstandPuntNaarFeature(
                                                lat,
                                                lon,
                                                road
                                            );

                                        if (
                                            !beste ||
                                            d < beste.afstand
                                        ) {
                                            beste = {
                                                ref,
                                                afstand: d
                                            };
                                        }

                                    }
                                );

                        }
                    );


                    if (
                        beste &&
                        beste.afstand <= 300
                    ) {
                        snelweg = beste.ref;
                    }

                }


                if (!snelweg) {
                    return;
                }


                if (
                    !aansluitingenPerSnelweg[
                        snelweg
                    ]
                ) {
                    aansluitingenPerSnelweg[
                        snelweg
                    ] = [];
                }


                /*
                    OSM kan dezelfde aansluiting meerdere keren
                    als Point bevatten. We voegen hem hier maar één
                    keer toe wanneer naam en locatie overeenkomen.
                */
                if (
                    isDubbeleAansluiting(
                        aansluitingenPerSnelweg[snelweg],
                        lat,
                        lon,
                        naam
                    )
                ) {
                    return;
                }


                aansluitingenPerSnelweg[
                    snelweg
                ].push({
                    lat,
                    lon,
                    naam,
                    feature
                });

            }
        );


    Object.keys(
        aansluitingenPerSnelweg
    )
    .forEach(
        snelweg => {

            aansluitingenPerSnelweg[
                snelweg
            ].sort(
                (a,b) =>
                    a.naam.localeCompare(
                        b.naam,
                        "nl"
                    )
            );

        }
    );

}


/* =========================================================
   VIA-KNOOPPUNTEN
========================================================= */

function krijgViaKnooppunten() {

    if (
        !osmJunctions ||
        !Array.isArray(
            osmJunctions.features
        )
    ) {
        return [];
    }


    const resultaat = [];


    osmJunctions.features
        .forEach(
            feature => {

                if (
                    !feature.geometry ||
                    feature.geometry.type !==
                    "Point"
                ) {
                    return;
                }


                const naam =
                    krijgNaam(feature);


                if (
                    !naam
                        .toLowerCase()
                        .startsWith(
                            "knooppunt "
                        )
                ) {
                    return;
                }


                const coords =
                    feature.geometry.coordinates;

                const lon =
                    Number(coords[0]);

                const lat =
                    Number(coords[1]);


                const naamSleutel =
                    String(naam)
                        .replace(/\s+/g, " ")
                        .trim()
                        .toLowerCase();


                /*
                    Sommige OSM-exports bevatten meerdere Point-features
                    voor hetzelfde knooppunt. Alleen punten met dezelfde
                    naam die ook geografisch dicht bij elkaar liggen,
                    worden als duplicaat gezien.
                */
                const dubbel =
                    resultaat.some(
                        bestaand =>
                            bestaand.naamSleutel === naamSleutel &&
                            afstandTussenPunten(
                                bestaand.lat,
                                bestaand.lon,
                                lat,
                                lon
                            ) <= 150
                    );


                if (dubbel) {
                    return;
                }


                resultaat.push({
                    naam,
                    naamSleutel,
                    lon,
                    lat,
                    feature
                });

            }
        );


    return resultaat;

}

    );

/* =========================================================
   PUNTEN
========================================================= */

function krijgPunt(
    snelweg,
    index
) {

    if (
        !aansluitingenPerSnelweg[
            snelweg
        ]
    ) {
        return null;
    }


    return (
        aansluitingenPerSnelweg[
            snelweg
        ][Number(index)] ||
        null
    );

}


function krijgKnooppunt(
    index
) {

    if (
        !osmJunctions ||
        !osmJunctions.features
    ) {
        return null;
    }


    const feature =
        osmJunctions
            .features[
                Number(index)
            ];


    if (
        !feature ||
        !feature.geometry ||
        feature.geometry.type !==
        "Point"
    ) {
        return null;
    }


    const naam =
        krijgNaam(feature);


    if (
        !naam
            .toLowerCase()
            .startsWith(
                "knooppunt "
            )
    ) {
        return null;
    }


    return {

        naam,

        lat:
            Number(
                feature.geometry.coordinates[1]
            ),

        lon:
            Number(
                feature.geometry.coordinates[0]
            )

    };

}


/* =========================================================
   OSRM
========================================================= */

async function haalRouteOp(
    punten
) {

    const coordinates =
        punten
            .map(
                p =>
                    `${p.lon},${p.lat}`
            )
            .join(";");


    const url =
        "https://router.project-osrm.org/route/v1/driving/" +
        coordinates +
        "?overview=full&geometries=geojson&steps=false";


    const response =
        await fetch(url);


    if (!response.ok) {
        throw new Error(
            "OSRM gaf geen geldige reactie."
        );
    }


    const data =
        await response.json();


    if (
        data.code !== "Ok" ||
        !data.routes ||
        !data.routes.length
    ) {

        throw new Error(
            "Geen route gevonden."
        );

    }


    return data.routes[0];

}


/* =========================================================
   ROUTE ZONE
========================================================= */

const ROUTE_ZONE_METER = 200;


function maakZoneKandidaten(
    punt,
    snelweg,
    radius,
    maximum = 24
) {

    const kandidaten = [];


    const features =
        exacteSnelwegen[
            snelweg
        ] || [];


    features.forEach(
        feature => {

            const dichtst =
                dichtstbijzijndePuntOpFeature(
                    punt.lat,
                    punt.lon,
                    feature
                );


            if (
                !dichtst ||
                dichtst.afstand >
                radius
            ) {
                return;
            }


            kandidaten.push({

                lat:
                    dichtst.lat,

                lon:
                    dichtst.lon,

                afstand:
                    dichtst.afstand

            });


            if (
                !feature.geometry
            ) {
                return;
            }


            const geometry =
                feature.geometry;


            const lijnen =
                geometry.type ===
                "LineString"

                    ? [
                        geometry.coordinates
                    ]

                    : (
                        geometry.type ===
                        "MultiLineString"

                            ? geometry.coordinates
                            : []
                    );


            lijnen.forEach(
                lijn => {

                    lijn.forEach(
                        coord => {

                            const d =
                                afstandTussenPunten(
                                    punt.lat,
                                    punt.lon,
                                    coord[1],
                                    coord[0]
                                );


                            if (
                                d <= radius
                            ) {

                                kandidaten.push({

                                    lat:
                                        coord[1],

                                    lon:
                                        coord[0],

                                    afstand:
                                        d

                                });

                            }

                        }
                    );

                }
            );

        }
    );


    kandidaten.sort(
        (a,b) =>
            a.afstand -
            b.afstand
    );


    const uniek = [];


    kandidaten.forEach(
        kandidaat => {

            const bestaat =
                uniek.some(
                    bestaand =>
                        afstandTussenPunten(
                            bestaand.lat,
                            bestaand.lon,
                            kandidaat.lat,
                            kandidaat.lon
                        ) < 20
                );


            if (!bestaat) {

                uniek.push(
                    kandidaat
                );

            }

        }
    );


    return uniek.slice(
        0,
        maximum
    );

}


/* =========================================================
   ROUTE AAN BEGIN/EINDE AFSNIJDEN
========================================================= */

function afstandVanRoute(
    coords,
    indexA,
    indexB
) {

    let totaal = 0;


    for (
        let i = indexA;
        i < indexB;
        i++
    ) {

        totaal +=
            afstandRouteSegment(
                coords[i],
                coords[i + 1]
            );

    }


    return totaal;

}


function stopRouteBinnenZone(
    route,
    eind
) {

    if (
        !route ||
        !route.geometry ||
        !route.geometry.coordinates
    ) {
        return route;
    }


    const coords =
        route.geometry.coordinates;


    for (
        let i = 0;
        i < coords.length;
        i++
    ) {

        const d =
            afstandTussenPunten(
                coords[i][1],
                coords[i][0],
                eind.lat,
                eind.lon
            );


        if (
            d <= ROUTE_ZONE_METER
        ) {

            const nieuweCoords =
                coords.slice(
                    0,
                    i + 1
                );


            if (
                nieuweCoords.length >= 2
            ) {

                let afstand = 0;

                for (
                    let j = 0;
                    j <
                    nieuweCoords.length - 1;
                    j++
                ) {

                    afstand +=
                        afstandRouteSegment(
                            nieuweCoords[j],
                            nieuweCoords[j + 1]
                        );

                }


                route.geometry.coordinates =
                    nieuweCoords;

                route.distance =
                    afstand;

            }


            return route;

        }

    }


    return route;

}


/* =========================================================
   NORMALE ROUTE
========================================================= */

async function berekenNormaleRoute(
    start,
    eind
) {

    const startKandidaten =
        maakZoneKandidaten(
            start,
            start.snelweg,
            ROUTE_ZONE_METER
        );


    const eindKandidaten =
        maakZoneKandidaten(
            eind,
            eind.snelweg,
            ROUTE_ZONE_METER
        );


    if (
        !startKandidaten.length ||
        !eindKandidaten.length
    ) {

        return haalRouteOp([
            start,
            eind
        ]);

    }


    let beste = null;


    const startAantal =
        Math.min(
            startKandidaten.length,
            8
        );

    const eindAantal =
        Math.min(
            eindKandidaten.length,
            8
        );


    for (
        let i = 0;
        i < startAantal;
        i++
    ) {

        for (
            let j = 0;
            j < eindAantal;
            j++
        ) {

            try {

                const route =
                    await haalRouteOp([

                        startKandidaten[i],

                        eindKandidaten[j]

                    ]);


                if (
                    !beste ||
                    route.distance <
                    beste.distance
                ) {

                    beste =
                        route;

                }

            } catch (error) {

                console.warn(
                    "Routepoging mislukt",
                    error
                );

            }

        }

    }


    if (!beste) {

        return haalRouteOp([
            start,
            eind
        ]);

    }


    return stopRouteBinnenZone(
        beste,
        eind
    );

}


/* =========================================================
   VIA SNELWEG
========================================================= */

function krijgViaWegen(
    snelweg
) {

    if (
        !osmSnelwegen ||
        !osmSnelwegen.features
    ) {
        return [];
    }


    return osmSnelwegen.features
        .filter(
            feature =>
                isExacteSnelweg(
                    feature,
                    snelweg
                )
        );

}


function maakViaKandidaten(
    snelweg,
    maximum = 12
) {

    const wegen =
        krijgViaWegen(
            snelweg
        );


    const kandidaten = [];


    wegen.forEach(
        feature => {

            if (
                !feature.geometry
            ) {
                return;
            }


            const geometry =
                feature.geometry;


            const lijnen =
                geometry.type ===
                "LineString"

                    ? [
                        geometry.coordinates
                    ]

                    : (
                        geometry.type ===
                        "MultiLineString"
                            ? geometry.coordinates
                            : []
                    );


            lijnen.forEach(
                lijn => {

                    if (
                        !lijn.length
                    ) {
                        return;
                    }


                    const stap =
                        Math.max(
                            1,
                            Math.floor(
                                lijn.length /
                                6
                            )
                        );


                    for (
                        let i = 0;
                        i < lijn.length;
                        i += stap
                    ) {

                        kandidaten.push({

                            lon:
                                lijn[i][0],

                            lat:
                                lijn[i][1]

                        });

                    }

                }
            );

        }
    );


    if (
        kandidaten.length <= maximum
    ) {

        return kandidaten;

    }


    const resultaat = [];

    const stap =
        kandidaten.length /
        maximum;


    for (
        let i = 0;
        i < maximum;
        i++
    ) {

        resultaat.push(
            kandidaten[
                Math.floor(
                    i * stap
                )
            ]
        );

    }


    return resultaat;

}


function puntLigtOpVia(
    coord,
    viaWegen,
    maxAfstand = 40
) {

    for (
        const feature of viaWegen
    ) {

        if (
            afstandPuntNaarFeature(
                coord[1],
                coord[0],
                feature
            ) <= maxAfstand
        ) {

            return true;

        }

    }


    return false;

}


function berekenViaAfstand(
    route,
    snelweg
) {

    if (
        !route ||
        !route.geometry
    ) {
        return 0;
    }


    const viaWegen =
        krijgViaWegen(
            snelweg
        );


    if (!viaWegen.length) {
        return 0;
    }


    const coords =
        route.geometry.coordinates;


    let totaal = 0;


    for (
        let i = 0;
        i < coords.length - 1;
        i++
    ) {

        if (
            puntLigtOpVia(
                coords[i],
                viaWegen
            ) &&
            puntLigtOpVia(
                coords[i + 1],
                viaWegen
            )
        ) {

            totaal +=
                afstandRouteSegment(
                    coords[i],
                    coords[i + 1]
                );

        }

    }


    return totaal;

}


async function zoekViaSnelwegRoute(
    start,
    eind,
    viaSnelweg
) {

    const viaKandidaten =
        maakViaKandidaten(
            viaSnelweg,
            10
        );


    if (
        !viaKandidaten.length
    ) {

        throw new Error(
            "Geen VIA-snelweg gevonden."
        );

    }


    let beste = null;


    for (
        const via of viaKandidaten
    ) {

        try {

            const route =
                await haalRouteOp([

                    start,

                    via,

                    eind

                ]);


            const viaAfstand =
                berekenViaAfstand(
                    route,
                    viaSnelweg
                );


            if (
                viaAfstand >= 500
            ) {

                if (
                    !beste ||
                    route.distance <
                    beste.distance
                ) {

                    beste =
                        route;

                }

            }

        } catch (error) {

            console.warn(
                "VIA-route mislukt",
                error
            );

        }

    }


    if (!beste) {

        throw new Error(
            `Geen route gevonden die minimaal 500 meter over ${viaSnelweg} loopt.`
        );

    }


    return beste;

}


/* =========================================================
   VIA KNOOPPUNT
========================================================= */

const VIA_KNOOPPUNT_ZONE_METER =
    1000;


function routeKomtBinnenAfstand(
    route,
    punt,
    maximaleAfstand
) {

    if (
        !route ||
        !route.geometry
    ) {
        return false;
    }


    return route.geometry.coordinates
        .some(
            coord =>
                afstandTussenPunten(
                    coord[1],
                    coord[0],
                    punt.lat,
                    punt.lon
                ) <= maximaleAfstand
        );

}


async function zoekViaKnooppuntRoute(
    start,
    eind,
    knooppunt
) {

    const kandidaten =
        maakZoneKandidaten(
            knooppunt,
            start.snelweg,
            VIA_KNOOPPUNT_ZONE_METER,
            8
        );


    kandidaten.push({

        lat:
            knooppunt.lat,

        lon:
            knooppunt.lon

    });


    let beste = null;


    for (
        const via of kandidaten
    ) {

        try {

            const route =
                await haalRouteOp([

                    start,

                    via,

                    eind

                ]);


            if (
                !routeKomtBinnenAfstand(
                    route,
                    knooppunt,
                    VIA_KNOOPPUNT_ZONE_METER
                )
            ) {
                continue;
            }


            if (
                !beste ||
                route.distance <
                beste.distance
            ) {

                beste =
                    route;

            }

        } catch (error) {

            console.warn(
                "Knooppunt-route mislukt",
                error
            );

        }

    }


    if (!beste) {

        throw new Error(
            "Geen route via dit knooppunt gevonden."
        );

    }


    return beste;

}


/* =========================================================
   ROUTE TEKENEN
========================================================= */

function tekenRoute(
    route,
    start,
    eind
) {

    if (routeLayer) {

        map.removeLayer(
            routeLayer
        );

    }


    if (startMarker) {

        map.removeLayer(
            startMarker
        );

    }


    if (endMarker) {

        map.removeLayer(
            endMarker
        );

    }


    const coords =
        route.geometry.coordinates
            .map(
                coord =>
                    [
                        coord[1],
                        coord[0]
                    ]
            );


    routeLayer =
        L.polyline(
            coords,
            {
                weight: 5
            }
        )
        .addTo(map);


    startMarker =
        L.marker([
            start.lat,
            start.lon
        ])
        .addTo(map);


    endMarker =
        L.marker([
            eind.lat,
            eind.lon
        ])
        .addTo(map);


    map.fitBounds(
        routeLayer.getBounds(),
        {
            padding: [
                30,
                30
            ]
        }
    );

}


/* =========================================================
   ROUTE ANALYSE VOOR RITTEN
========================================================= */

/*
    Deze analyse is bewust relatief licht gehouden.

    De junction-detectie wordt hier nog NIET uitgebreid.
    Dat doen we later apart.

    We bepalen voorlopig per routegedeelte welke
    exacte/gekoppelde A-wegen in de OSM-data het dichtst
    bij de route liggen.
*/


function normaliseerRouteRef(
    ref
) {

    const refs =
        [
            ...new Set(
                krijgARefsUitRef(
                    ref
                )
            )
        ];


    if (!refs.length) {
        return null;
    }


    refs.sort(
        (a,b) =>
            Number(
                a.substring(1)
            ) -
            Number(
                b.substring(1)
            )
    );


    return refs.join("/");

}


function krijgRouteSnelwegBijCoord(
    coord,
    maxAfstand = 120
) {

    if (
        !osmSnelwegen ||
        !osmSnelwegen.features
    ) {
        return null;
    }


    let beste = null;


    for (
        const feature of
        osmSnelwegen.features
    ) {

        const label =
            normaliseerRouteRef(
                krijgRef(
                    feature
                )
            );


        if (!label) {
            continue;
        }


        const afstand =
            afstandPuntNaarFeature(
                coord[1],
                coord[0],
                feature
            );


        if (
            afstand > maxAfstand
        ) {
            continue;
        }


        const aantal =
            label.split("/").length;


        /*
            Bij een gecombineerde OSM-ref zoals
            A1;A35 geven we die voorkeur als hij
            ongeveer even dichtbij ligt.
        */

        if (
            !beste ||
            (
                aantal > beste.aantal &&
                afstand <=
                beste.afstand + 50
            ) ||
            (
                aantal === beste.aantal &&
                afstand < beste.afstand
            )
        ) {

            beste = {

                label,

                afstand,

                aantal

            };

        }

    }


    return beste
        ? beste.label
        : null;

}


function analyseerRouteSegmenten(
    route
) {

    if (
        !route ||
        !route.geometry ||
        !route.geometry.coordinates
    ) {

        return [];

    }


    const coords =
        route.geometry.coordinates;


    if (
        coords.length < 2
    ) {

        return [];

    }


    /*
        We analyseren maximaal ongeveer 120 punten.
        Hierdoor blijft een lange route licht.
    */

    const maximumSamples = 120;

    const stap =
        Math.max(
            1,
            Math.ceil(
                coords.length /
                maximumSamples
            )
        );


    const samples = [];


    for (
        let i = 0;
        i < coords.length;
        i += stap
    ) {

        samples.push({

            index: i,

            label:
                krijgRouteSnelwegBijCoord(
                    coords[i]
                )

        });

    }


    if (
        samples[
            samples.length - 1
        ].index !==
        coords.length - 1
    ) {

        samples.push({

            index:
                coords.length - 1,

            label:
                krijgRouteSnelwegBijCoord(
                    coords[
                        coords.length - 1
                    ]
                )

        });

    }


    /*
        Kleine gaten tussen twee gelijke
        snelweglabels vullen.
    */

    for (
        let i = 1;
        i < samples.length - 1;
        i++
    ) {

        if (
            samples[i].label
        ) {
            continue;
        }


        const vorige =
            samples[i - 1];

        const volgende =
            samples[i + 1];


        if (
            vorige.label &&
            volgende.label &&
            vorige.label ===
            volgende.label
        ) {

            samples[i].label =
                vorige.label;

        }

    }


    const runs = [];


    let huidige = null;


    samples.forEach(
        sample => {

            if (
                !sample.label
            ) {

                if (huidige) {

                    huidige.eindIndex =
                        sample.index;

                    runs.push(
                        huidige
                    );

                    huidige = null;

                }

                return;

            }


            if (
                !huidige ||
                huidige.label !==
                sample.label
            ) {

                if (huidige) {

                    huidige.eindIndex =
                        sample.index;

                    runs.push(
                        huidige
                    );

                }


                huidige = {

                    label:
                        sample.label,

                    startIndex:
                        sample.index,

                    eindIndex:
                        sample.index

                };

            } else {

                huidige.eindIndex =
                    sample.index;

            }

        }
    );


    if (huidige) {

        huidige.eindIndex =
            coords.length - 1;

        runs.push(
            huidige
        );

    }


    const segmenten = [];


    runs.forEach(
        run => {

            if (
                run.eindIndex <=
                run.startIndex
            ) {
                return;
            }


            const afstand =
                afstandVanRoute(
                    coords,
                    run.startIndex,
                    run.eindIndex
                );


            if (
                afstand < 0.2
            ) {
                return;
            }


            segmenten.push({

                snelweg:
                    run.label,

                afstandKm:
                    afstand / 1000,

                startIndex:
                    run.startIndex,

                eindIndex:
                    run.eindIndex

            });

        }
    );


    /*
        Als eenzelfde label in twee opeenvolgende
        runs terechtkomt, voegen we ze samen.
    */

    const samengevoegd = [];


    segmenten.forEach(
        segment => {

            const vorige =
                samengevoegd[
                    samengevoegd.length - 1
                ];


            if (
                vorige &&
                vorige.snelweg ===
                segment.snelweg
            ) {

                vorige.afstandKm +=
                    segment.afstandKm;

                vorige.eindIndex =
                    segment.eindIndex;

            } else {

                samengevoegd.push({

                    snelweg:
                        segment.snelweg,

                    afstandKm:
                        segment.afstandKm,

                    startIndex:
                        segment.startIndex,

                    eindIndex:
                        segment.eindIndex

                });

            }

        }
    );


    return samengevoegd;

}


/* =========================================================
   ROUTE NAAM
========================================================= */

function naamVanAansluiting(
    punt
) {

    if (!punt) {
        return "";
    }


    return maakAansluitingNaam(
        punt.naam
    );

}


/* =========================================================
   HUIDIGE ROUTE OPSLAAN
========================================================= */

async function berekenRoute() {

    if (!dataGeladen) {

        document.getElementById(
            "resultaat"
        ).innerHTML =
            "De OSM-data is nog niet geladen.";

        return;

    }


    const opritSnelweg =
        document.getElementById(
            "opritSnelweg"
        ).value;


    const opritIndex =
        document.getElementById(
            "oprit"
        ).value;


    const via =
        document.getElementById(
            "viaSnelweg"
        ).value;


    const afritSnelweg =
        document.getElementById(
            "afritSnelweg"
        ).value;


    const afritIndex =
        document.getElementById(
            "afrit"
        ).value;


    if (
        !opritSnelweg ||
        opritIndex === "" ||
        !afritSnelweg ||
        afritIndex === ""
    ) {

        alert(
            "Kies eerst een oprit en afrit."
        );

        return;

    }


    const start =
        krijgPunt(
            opritSnelweg,
            opritIndex
        );


    const eind =
        krijgPunt(
            afritSnelweg,
            afritIndex
        );


    if (
        !start ||
        !eind
    ) {

        alert(
            "De gekozen aansluiting kon niet worden gevonden."
        );

        return;

    }


    start.snelweg =
        opritSnelweg;

    eind.snelweg =
        afritSnelweg;


    const resultaat =
        document.getElementById(
            "resultaat"
        );


    const toevoegenKnop =
        document.getElementById(
            "routeToevoegenKnop"
        );


    toevoegenKnop.disabled =
        true;


    resultaat.innerHTML =
        "Route wordt berekend...";


    try {

        let route;


        if (
            via &&
            via.startsWith(
                "road:"
            )
        ) {

            const viaSnelweg =
                via.substring(5);


            route =
                await zoekViaSnelwegRoute(
                    start,
                    eind,
                    viaSnelweg
                );

        } else if (
            via &&
            via.startsWith(
                "junction:"
            )
        ) {

            const knooppunt =
                krijgKnooppunt(
                    Number(
                        via.split(":")[1]
                    )
                );


            if (!knooppunt) {

                throw new Error(
                    "Knooppunt niet gevonden."
                );

            }


            route =
                await zoekViaKnooppuntRoute(
                    start,
                    eind,
                    knooppunt
                );

        } else {

            route =
                await berekenNormaleRoute(
                    start,
                    eind
                );

        }


        const afstandKm =
            (
                route.distance /
                1000
            ).toFixed(1);


        if (via) {

            if (
                via.startsWith(
                    "road:"
                )
            ) {

                const viaSnelweg =
                    via.substring(5);


                resultaat.innerHTML =
                    `<strong>Afstand:</strong> ${afstandKm} km<br>` +
                    `<strong>VIA:</strong> ${viaSnelweg}`;

            } else {

                const knooppunt =
                    krijgKnooppunt(
                        Number(
                            via.split(":")[1]
                        )
                    );


                resultaat.innerHTML =
                    `<strong>Afstand:</strong> ${afstandKm} km<br>` +
                    `<strong>VIA:</strong> ${
                        knooppunt
                            ? knooppunt.naam
                            : "Knooppunt"
                    }`;

            }

        } else {

            resultaat.innerHTML =
                `<strong>Afstand:</strong> ${afstandKm} km`;

        }


        tekenRoute(
            route,
            start,
            eind
        );


        const segmenten =
            analyseerRouteSegmenten(
                route
            );


        laatsteBerekendeRoute = {

            route,

            afstandKm:
                Number(
                    afstandKm
                ),

            opritSnelweg,

            opritIndex:
                Number(
                    opritIndex
                ),

            afritSnelweg,

            afritIndex:
                Number(
                    afritIndex
                ),

            via,

            start: {

                lat:
                    start.lat,

                lon:
                    start.lon,

                naam:
                    naamVanAansluiting(
                        start
                    )

            },

            eind: {

                lat:
                    eind.lat,

                lon:
                    eind.lon,

                naam:
                    naamVanAansluiting(
                        eind
                    )

            },

            segmenten,

            routeCoordinates:
                route.geometry.coordinates

        };


        toevoegenKnop.disabled =
            false;


    } catch (error) {

        console.error(
            error
        );


        resultaat.innerHTML =
            `<strong>Fout:</strong> ${error.message}`;


        laatsteBerekendeRoute =
            null;

        toevoegenKnop.disabled =
            true;

    }

}


/* =========================================================
   ROUTE TOEVOEGEN
========================================================= */

function voegHuidigeRouteToe() {

    if (
        !laatsteBerekendeRoute
    ) {

        return;

    }


    const rit =
        laatsteBerekendeRoute;


    const nieuweRit = {

        id:
            Date.now(),

        naam:
            `${rit.start.naam} - ${rit.eind.naam}`,

        datum:
            vandaagISO(),

        afstandKm:
            rit.afstandKm,

        opritSnelweg:
            rit.opritSnelweg,

        opritIndex:
            rit.opritIndex,

        afritSnelweg:
            rit.afritSnelweg,

        afritIndex:
            rit.afritIndex,

        via:
            rit.via,

        start:
            rit.start,

        eind:
            rit.eind,

        segmenten:
            rit.segmenten,

        routeCoordinates:
            rit.routeCoordinates

    };


    const ritten =
        haalRitten();


    ritten.push(
        nieuweRit
    );


    slaRittenOp(
        ritten
    );


    alert(
        "Route toegevoegd aan je ritten."
    );


    document.getElementById(
        "routeToevoegenKnop"
    ).disabled = true;

}


/* =========================================================
   RITTENLIJST
========================================================= */

function toonRitten() {

    const container =
        document.getElementById(
            "rittenLijst"
        );


    const ritten =
        haalRitten();


    container.innerHTML =
        "";


    if (!ritten.length) {

        container.innerHTML =
            `<div class="geen-ritten">
                Er zijn nog geen ritten toegevoegd.
            </div>`;

        return;

    }


    const gesorteerd =
        [...ritten]
        .sort(
            (a,b) =>
                String(b.datum)
                    .localeCompare(
                        String(a.datum)
                    )
        );


    gesorteerd.forEach(
        rit => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "rit-item";


            const naam =
                document.createElement(
                    "button"
                );

            naam.className =
                "rit-naam";

            naam.textContent =
                rit.naam;

            naam.onclick =
                () =>
                    openRit(
                        rit.id
                    );


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "rit-info";

            info.textContent =
                `${formatteerDatum(
                    rit.datum
                )} - ${Number(
                    rit.afstandKm
                ).toFixed(0)} km`;


            item.appendChild(
                naam
            );

            item.appendChild(
                info
            );


            container.appendChild(
                item
            );

        }
    );

}

function slaNieuweDatumOp() {

    const datum =
        document.getElementById(
            "nieuweDatum"
        ).value;


    if (!datum) {

        alert(
            "Kies een datum."
        );

        return;

    }


    const ritten =
        haalRitten();


    const index =
        ritten.findIndex(
            r =>
                Number(r.id) ===
                Number(huidigeRitId)
        );


    if (index === -1) {
        return;
    }


    ritten[index].datum =
        datum;


    slaRittenOp(

}

async function slaAangepasteRouteOp() {

    const ritten =
        haalRitten();


    const index =
        ritten.findIndex(
            r =>
                Number(r.id) ===
                Number(huidigeRitId)
        );


    if (index === -1) {
        return;
    }


    const rit =
        ritten[index];


    const opritSnelweg =
        document.getElementById(
            "editOpritSnelweg"
        ).value;


    const opritIndex =
        document.getElementById(
            "editOprit"
        ).value;


    const via =
        document.getElementById(
            "editVia"
        ).value;


    const afritSnelweg =
        document.getElementById(
            "editAfritSnelweg"
        ).value;


    const afritIndex =
        document.getElementById(
            "editAfrit"
        ).value;


    if (
        !opritSnelweg ||
        opritIndex === "" ||
        !afritSnelweg ||
        afritIndex === ""
    ) {

        alert(
            "Vul oprit en afrit volledig in."
        );

        return;

    }


    const start =
        krijgPunt(
            opritSnelweg,
            opritIndex
        );


    const eind =
        krijgPunt(
            afritSnelweg,
            afritIndex
        );


    if (
        !start ||
        !eind
    ) {

        alert(
            "De gekozen aansluiting kon niet worden gevonden."
        );

        return;

    }


    start.snelweg =
        opritSnelweg;

    eind.snelweg =
        afritSnelweg;


    const editor =
        document.getElementById(
            "routeEditor"
        );


    editor.innerHTML =
        `
        <div class="editor">
            Route wordt opnieuw berekend...
        </div>
        `;


    try {

        let route;


        if (
            via &&
            via.startsWith(
                "road:"
            )
        ) {

            route =
                await zoekViaSnelwegRoute(
                    start,
                    eind,
                    via.substring(5)
                );

        } else if (
            via &&
            via.startsWith(
                "junction:"
            )
        ) {

            const knooppunt =
                krijgKnooppunt(
                    Number(
                        via.split(":")[1]
                    )
                );


            if (!knooppunt) {

                throw new Error(
                    "Knooppunt niet gevonden."
                );

            }


            route =
                await zoekViaKnooppuntRoute(
                    start,
                    eind,
                    knooppunt
                );

        } else {

            route =
                await berekenNormaleRoute(
                    start,
                    eind
                );

        }


        const segmenten =
            analyseerRouteSegmenten(
                route
            );


        rit.naam =
            `${naamVanAansluiting(
                start
            )} - ${naamVanAansluiting(
                eind
            )}`;


        rit.afstandKm =
            Number(
                (
                    route.distance /
                    1000
                ).toFixed(1)
            );


        rit.opritSnelweg =
            opritSnelweg;

        rit.opritIndex =
            Number(
                opritIndex
            );

        rit.afritSnelweg =
            afritSnelweg;

        rit.afritIndex =
            Number(
                afritIndex
            );

        rit.via =
            via;

        rit.start = {

            lat:
                start.lat,

            lon:
                start.lon,

            naam:
                naamVanAansluiting(
                    start
                )

        };


        rit.eind = {

            lat:
                eind.lat,

            lon:
                eind.lon,

            naam:
                naamVanAansluiting(
                    eind
                )

        };


        rit.segmenten =
            segmenten;


        rit.routeCoordinates =
            route.geometry.coordinates;


        /*
            Datum blijft bewust hetzelfde.
        */


        slaRittenOp(
            ritten
        );


        toonRitDetail();


    } catch (error) {

        console.error(
            error
        );


        editor.innerHTML =
            `
            <div class="editor">

                <strong>Route kon niet worden aangepast.</strong>

                <div class="status-message">
                    ${error.message}
                </div>

            </div>
            `;

    }

}
